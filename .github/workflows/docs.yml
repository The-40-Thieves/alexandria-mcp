# Publishes docs/ to https://the40thieves.dev/alexandria-mcp/docs/ through the org's reusable workflow
# (The-40-Thieves/.github, docs-template). Pinned to a commit of that repository; bump the sha to
# pick up template changes.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: The-40-Thieves/.github/.github/workflows/docs-deploy.yml@0ecf2ca9a6c7a4d7ea7ce79723b60bfd5a75229d # 0ecf2ca
    with:
      project: alexandria-mcp
      docs-path: docs
      title: alexandria-mcp
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
