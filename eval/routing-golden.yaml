# Routing golden set (THE-320). Each entry names a natural-language query
# and the 1-3 sources a correct stage-1/stage-2 selection should surface,
# written by hand from each source's own registry description (see
# docs/sources.md or run `library_list_sources`). Loaded by
# scripts/eval-routing.ts to score nDCG@5 and recall@5.
#
# A source may be `hidden` (needs an API key not set in this environment);
# the unit test that checks every `expected` name is real validates against
# listSources() (which includes hidden sources), not catalog() (which
# doesn't) - a hidden expected source is a legitimate, if currently
# unreachable, answer.

# ── academic ────────────────────────────────────────────────────────────────
- query: recent preprints on diffusion models for music generation
  expected: [arxiv]
- query: open access papers on climate change across all academic disciplines
  expected: [openalex, doaj]
- query: biomedical literature on CRISPR gene editing with full text
  expected: [europmc, plos]
- query: psychology preprints on cognitive bias from OSF
  expected: [osf]
- query: Cambridge University theses and working papers
  expected: [apollo]
- query: look up a DOI's reference list and publisher metadata
  expected: [crossref]
- query: MeSH indexed biomedical journal article search by PMID
  expected: [pubmed]
- query: find the DOI for a dataset deposited on Zenodo or Figshare
  expected: [datacite]

